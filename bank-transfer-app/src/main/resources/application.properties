spring.application.name=bank-transfer-app

spring.config.import=optional:file:E:/bank-transfer-app/bank-transfer-app/secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG